
name: CODE AI UG Automatic Training

on:
  push:
    branches:
      - main
    paths:
      - "model/**"
      - "training/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-ai-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    name: Train CODE AI UG
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Train neural network
        run: |
          python training/train.py

      - name: Save trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-ai-ug-trained-model
          path: checkpoints/code_ai_ug.pt
          if-no-files-found: error
          retention-days: 14
