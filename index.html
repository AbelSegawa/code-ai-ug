<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141c"><meta name="description" content="CODE AI UG — AI assistant created by Abel Ssegawa">
<title>CODE AI UG — AI Assistant</title>
<style>
:root{--bg:#f6f8fb;--side:#fff;--surface:#fff;--soft:#f0f3f7;--text:#18212f;--muted:#788496;--line:#e4e9ef;--accent:#13a879;--accent2:#0e8c66;--user:#e9f2ef;--code:#101722;--shadow:0 10px 35px #14233212}
body.dark{--bg:#10141c;--side:#151b25;--surface:#191f2a;--soft:#222b38;--text:#edf2f8;--muted:#9aa8ba;--line:#2b3544;--accent:#21bd8b;--accent2:#16a779;--user:#243a37;--code:#0b111a;--shadow:0 10px 35px #0003}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex}.sidebar{width:280px;min-width:280px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:21px 16px;z-index:20;transition:.25s}
.brand{display:flex;align-items:center;gap:12px;padding:4px 7px 25px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#20c992,#087c5c);display:grid;place-items:center;color:white;font-size:24px;font-weight:900;box-shadow:0 6px 18px #13a87940}.brand-name{font-weight:850;font-size:19px;letter-spacing:-.7px}.brand-sub{color:var(--muted);font-size:9px;letter-spacing:1.4px;margin-top:4px}
.new-chat{height:47px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:700}.new-chat:hover,.send:hover{background:var(--accent2)}
.search{margin-top:16px;height:42px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 11px;gap:9px;background:var(--surface)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.label{font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--muted);margin:25px 8px 12px}.history{flex:1;overflow:auto}.history-item{padding:11px 10px;margin-bottom:4px;border-radius:9px;color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;cursor:pointer}.history-item:hover,.history-item.active{background:var(--soft);color:var(--text)}.history-item .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.del{border:0;background:none;color:var(--muted);font-size:16px}
.creator{border-top:1px solid var(--line);padding:18px 5px 5px;display:flex;gap:11px;align-items:center}.creator-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:800;color:var(--accent)}.creator-name{font-size:12px;font-weight:750}.creator-role{font-size:10px;color:var(--muted);margin-top:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--surface);border-bottom:1px solid var(--line)}.top-left{display:flex;align-items:center;gap:14px}.top-title{font-size:14px;font-weight:800}.status{font-size:10px;color:var(--accent);margin-top:5px}.top-right{display:flex;gap:9px;align-items:center}.model{border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--muted);font-size:11px}.icon{width:39px;height:39px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);font-size:17px}.menu{display:none}
.chat{flex:1;overflow:auto;scroll-behavior:smooth;padding:30px 18px 35px}.welcome{max-width:700px;margin:65px auto 30px;text-align:center}.welcome-logo{width:65px;height:65px;border-radius:21px;margin:0 auto 24px;display:grid;place-items:center;background:linear-gradient(145deg,#20c992,#087c5c);color:white;font-size:34px;font-weight:900;box-shadow:0 12px 30px #13a87938}.welcome h1{font-size:clamp(25px,4vw,37px);letter-spacing:-1.3px}.welcome h1 span{color:var(--accent)}.welcome>p{max-width:490px;margin:14px auto 0;color:var(--muted);line-height:1.8;font-size:13px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:35px auto 0;text-align:left}.suggestion{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:17px;text-align:left}.suggestion:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}.suggestion i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--soft);margin-bottom:12px;font-style:normal}.suggestion strong{font-size:12px}.suggestion p{font-size:11px;color:var(--muted);margin-top:5px}
.message{max-width:820px;margin:0 auto 27px;display:flex;gap:13px;align-items:flex-start}.avatar{width:36px;height:36px;min-width:36px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:850}.avatar.user{background:var(--soft)}.avatar.ai{background:linear-gradient(145deg,#20c992,#087c5c);color:white}.content{flex:1;min-width:0;padding-top:3px}.heading{font-size:12px;font-weight:800;margin-bottom:9px}.text{font-size:14px;line-height:1.85;overflow-wrap:anywhere}.user-text{display:inline-block;background:var(--user);border-radius:4px 14px 14px 14px;padding:11px 15px;white-space:pre-wrap}.text p{margin:0 0 12px}.text h1,.text h2,.text h3{margin:17px 0 9px}.text ul,.text ol{padding-left:23px;margin:9px 0}.text li{margin:5px 0}.text blockquote{border-left:3px solid var(--accent);padding-left:13px;color:var(--muted);margin:12px 0}.text a{color:var(--accent)}.text code{background:var(--soft);padding:3px 6px;border-radius:5px;font:12px monospace}
.codeblock{background:var(--code);color:#e4edf7;border-radius:12px;margin:13px 0;overflow:hidden;border:1px solid var(--line)}.codehead{padding:10px 13px;background:#ffffff0a;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;font-size:10px;color:#aebdce}.codecopy{border:1px solid #465263;color:#e5edf7;background:transparent;border-radius:6px;padding:5px 9px;font-size:10px}.codeblock pre{padding:15px;overflow:auto;white-space:pre;font:12px/1.7 monospace}
.actions{display:flex;gap:8px;margin-top:11px}.action{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:7px;font-size:10px}.action:hover{color:var(--accent);border-color:var(--accent)}
.typing{display:flex;gap:5px;padding:8px 0}.typing span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce .8s infinite alternate}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.composer-area{padding:12px 18px 17px;background:var(--bg);flex-shrink:0}.composer{max-width:820px;margin:auto;padding:11px 12px 10px 17px;background:var(--surface);border:1px solid var(--line);border-radius:17px;display:flex;align-items:flex-end;gap:10px;box-shadow:var(--shadow)}.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #13a87917}.composer textarea{flex:1;min-width:0;max-height:150px;min-height:37px;resize:none;outline:0;border:0;background:transparent;color:var(--text);font-size:13px;line-height:1.6;padding:9px 0}.composer textarea::placeholder{color:var(--muted)}.send{width:43px;height:43px;border:0;border-radius:12px;background:var(--accent);color:white;font-size:20px;font-weight:bold}.send:disabled{opacity:.5}.hint{text-align:center;font-size:9px;color:var(--muted);margin-top:10px;line-height:1.5}.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,15px);opacity:0;background:#202b37;color:white;padding:11px 17px;border-radius:10px;font-size:12px;z-index:100;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{display:none}
@keyframes bounce{to{transform:translateY(-6px);opacity:.5}}
@media(max-width:760px){.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:15}.menu{display:inline-block}.topbar{height:65px;padding:0 12px}.model{display:none}.chat{padding:24px 12px}.welcome{margin:45px auto 25px}.welcome h1{font-size:27px}.welcome-logo{width:57px;height:57px;font-size:29px}.suggestions{gap:9px;margin-top:27px}.suggestion{padding:13px}.message{gap:10px;margin-bottom:23px}.avatar{width:33px;height:33px;min-width:33px}.text{font-size:13px}.composer-area{padding:9px 10px 12px}.composer{border-radius:15px}}
@media(max-width:380px){.suggestions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
<div class="brand"><div class="logo">C</div><div><div class="brand-name">CODE AI UG</div><div class="brand-sub">INTELLIGENCE REIMAGINED</div></div></div>
<button class="new-chat" onclick="newChat()">＋ New conversation</button>
<div class="search"><span>⌕</span><input id="searchInput" placeholder="Search conversations..." oninput="renderHistory()"></div>
<div class="label">YOUR CONVERSATIONS</div><div class="history" id="history"></div>
<div class="creator"><div class="creator-avatar">AS</div><div><div class="creator-name">Abel Ssegawa</div><div class="creator-role">Founder &amp; Creator</div></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="icon menu" onclick="toggleSidebar()">☰</button><div><div class="top-title">CODE AI UG</div><div class="status">● AI SYSTEM READY</div></div></div><div class="top-right"><div class="model">Groq AI · GPT-OSS 120B</div><button class="icon" onclick="toggleTheme()" title="Switch theme">◐</button></div></header>
<section class="chat" id="chat"></section>
<footer class="composer-area"><div class="composer"><textarea id="question" rows="1" placeholder="Message CODE AI UG..." oninput="resizeBox(this)" onkeydown="handleKey(event)"></textarea><button class="send" id="send" onclick="sendMessage()">↑</button></div><div class="hint">CODE AI UG can make mistakes. Verify important information.<br>Created with innovation by Abel Ssegawa.</div></footer>
</main></div><div class="toast" id="toast"></div>
<script>
"use strict";
const API_URL="https://code-ai-ug-api.abelsegawa39.workers.dev";
const STORAGE_KEY="code_ai_ug_conversations_v2",THEME_KEY="code_ai_ug_theme_v2";
const SYSTEM_PROMPT="You are CODE AI UG, a helpful, capable AI assistant created by Abel Ssegawa. Be clear, accurate and friendly. Help especially with programming. Put code in fenced code blocks and explain how to use it.";
let conversations=[],activeChatId=null,isLoading=false,toastTimer;
function loadChats(){try{let x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");conversations=Array.isArray(x)?x.filter(c=>c&&c.id&&Array.isArray(c.messages)):[]}catch{conversations=[]}}
function saveChats(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(conversations))}catch{toast("Storage is full; history may not save.")}}
function activeChat(){return conversations.find(c=>c.id===activeChatId)}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2300)}
function newChat(){if(isLoading)return;activeChatId=null;showWelcome();renderHistory();let q=document.getElementById("question");q.value="";resizeBox(q);closeSidebar();q.focus()}
function createChat(q){let c={id:Date.now()+Math.random().toString(36).slice(2),title:q.slice(0,45),updated:Date.now(),messages:[]};conversations.unshift(c);activeChatId=c.id;saveChats();renderHistory();return c}
function openChat(id){if(isLoading)return;let c=conversations.find(x=>x.id===id);if(!c)return;activeChatId=id;document.getElementById("chat").innerHTML="";c.messages.forEach(m=>addMessage(m.role,m.content));renderHistory();closeSidebar()}
function deleteChat(id,e){e.stopPropagation();if(isLoading)return;conversations=conversations.filter(c=>c.id!==id);if(activeChatId===id){activeChatId=null;showWelcome()}saveChats();renderHistory()}
function renderHistory(){let q=(document.getElementById("searchInput").value||"").toLowerCase(),el=document.getElementById("history");el.innerHTML="";let list=conversations.filter(c=>(c.title||"").toLowerCase().includes(q));if(!list.length){let p=document.createElement("p");p.style.cssText="padding:12px;color:var(--muted);font-size:11px";p.textContent=q?"No matching conversations.":"Your conversations will appear here.";el.append(p);return}list.forEach(c=>{let row=document.createElement("div");row.className="history-item"+(c.id===activeChatId?" active":"");row.onclick=()=>openChat(c.id);let ico=document.createElement("span");ico.textContent="◷";let title=document.createElement("span");title.className="title";title.textContent=c.title;let del=document.createElement("button");del.className="del";del.textContent="×";del.title="Delete conversation";del.onclick=e=>deleteChat(c.id,e);row.append(ico,title,del);el.append(row)})}
function welcomeHTML(){return `<div class="welcome"><div class="welcome-logo">C</div><h1>What can I help you <span>create today?</span></h1><p>Welcome to CODE AI UG. Your intelligent assistant for programming, learning, creativity and innovation.</p><div class="suggestions"><button class="suggestion" onclick="suggest('Help me build a professional Android application.')"><i>⌘</i><strong>Build an application</strong><p>Create Android apps and websites.</p></button><button class="suggestion" onclick="suggest('Teach me HTML, CSS and JavaScript step by step.')"><i>⌁</i><strong>Learn programming</strong><p>Improve your coding knowledge.</p></button><button class="suggestion" onclick="suggest('Give me innovative business ideas and explain how to start.')"><i>✧</i><strong>Explore new ideas</strong><p>Discover opportunities and solutions.</p></button><button class="suggestion" onclick="suggest('Explain artificial intelligence in simple terms.')"><i>◎</i><strong>Explore technology</strong><p>Understand modern technology.</p></button></div></div>`}
function showWelcome(){document.getElementById("chat").innerHTML=welcomeHTML()}
function suggest(s){document.getElementById("question").value=s;sendMessage()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function markdown(src){
 let blocks=[];let s=esc(src).replace(/```([\w.+-]*)\n?([\s\S]*?)```/g,(m,lang,code)=>{blocks.push({lang:lang||"code",code:code.replace(/\n$/,"")});return "@@CB"+(blocks.length-1)+"@@"});
 s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^&gt; (.*)$/gm,"<blockquote>$1</blockquote>").replace(/^- (.*)$/gm,"<li>$1</li>");
 s=s.replace(/(<li>.*<\/li>\n?)+/g,x=>"<ul>"+x+"</ul>");
 s=s.split(/\n{2,}/).map(p=>{p=p.trim();if(!p)return "";if(/^@@CB\d+@@$/.test(p)||/^<(h[1-3]|ul|blockquote)/.test(p))return p;return "<p>"+p.replace(/\n/g,"<br>")+"</p>"}).join("");
 return s.replace(/@@CB(\d+)@@/g,(m,n)=>{let b=blocks[+n],encoded=encodeURIComponent(b.code);return `<div class="codeblock"><div class="codehead"><span>${esc(b.lang)}</span><button class="codecopy" onclick="copyCode('${encoded}')">Copy code</button></div><pre><code>${b.code}</code></pre></div>`})
}
function addMessage(role,content){let wrap=document.createElement("div");wrap.className="message";let av=document.createElement("div");av.className="avatar "+(role==="user"?"user":"ai");av.textContent=role==="user"?"YOU":"AI";let body=document.createElement("div");body.className="content";let h=document.createElement("div");h.className="heading";h.textContent=role==="user"?"You":"CODE AI UG";let tx=document.createElement("div");tx.className="text";if(role==="user"){tx.className+=" user-text";tx.textContent=content}else tx.innerHTML=markdown(content);body.append(h,tx);if(role!=="user"){let acts=document.createElement("div");acts.className="actions";let b=document.createElement("button");b.className="action";b.textContent="Copy response";b.onclick=()=>copyText(content);acts.append(b);body.append(acts)}wrap.append(av,body);document.getElementById("chat").append(wrap);document.getElementById("chat").scrollTop=1e9;return wrap}
function typing(){let x=document.createElement("div");x.className="message";x.id="typing";x.innerHTML='<div class="avatar ai">AI</div><div class="content"><div class="heading">CODE AI UG</div><div class="typing"><span></span><span></span><span></span></div></div>';document.getElementById("chat").append(x);document.getElementById("chat").scrollTop=1e9}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch{let x=document.createElement("textarea");x.value=s;document.body.append(x);x.select();document.execCommand("copy");x.remove()}toast("Copied to clipboard.")}
function copyCode(s){copyText(decodeURIComponent(s))}
function resizeBox(x){x.style.height="auto";x.style.height=Math.min(x.scrollHeight,150)+"px"}
function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}}
function extractText(d){if(typeof d==="string")return d;return d?.choices?.[0]?.message?.content??d?.message?.content??d?.reply??d?.response??d?.content??d?.output??null}
async function sendMessage(){
 if(isLoading)return;let input=document.getElementById("question"),q=input.value.trim();if(!q)return;input.value="";resizeBox(input);
 if(!activeChat())createChat(q);let c=activeChat();c.messages.push({role:"user",content:q});c.updated=Date.now();saveChats();renderHistory();
 if(document.querySelector(".welcome"))document.getElementById("chat").innerHTML="";
 addMessage("user",q);typing();isLoading=true;document.getElementById("send").disabled=true;document.getElementById("send").textContent="…";
 try{
  let messages=[{role:"system",content:SYSTEM_PROMPT},...c.messages.map(m=>({role:m.role,content:m.content}))];
  let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  let raw=await r.text(),data;try{data=raw?JSON.parse(raw):{}}catch{throw Error("The Worker returned an unreadable response.")}
  if(!r.ok){let er=data?.error?.message||data?.error||data?.message||"HTTP "+r.status;throw Error(typeof er==="string"?er:JSON.stringify(er))}
  let answer=extractText(data);if(!answer)throw Error("No assistant text was found in the Worker response. Check its response format.");
  c.messages.push({role:"assistant",content:answer});c.updated=Date.now();saveChats();document.getElementById("typing")?.remove();addMessage("assistant",answer);
 }catch(err){document.getElementById("typing")?.remove();addMessage("assistant","I couldn't connect to the AI service. "+(err.message||"Unknown error")+"\n\nCheck that your Cloudflare Worker is deployed and accepts POST requests containing a messages array.")}
 finally{isLoading=false;document.getElementById("send").disabled=false;document.getElementById("send").textContent="↑";renderHistory();input.focus()}
}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem(THEME_KEY,document.body.classList.contains("dark")?"dark":"light")}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("show")}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("show")}
function init(){loadChats();if(localStorage.getItem(THEME_KEY)==="dark")document.body.classList.add("dark");showWelcome();renderHistory();if(conversations.length){let latest=[...conversations].sort((a,b)=>(b.updated||0)-(a.updated||0))[0];openChat(latest.id)}}
init();
</script>
</body></html>
